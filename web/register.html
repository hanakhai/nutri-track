<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — NutriTrack</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div style="display: flex; justify-content: center; margin-bottom: 0.5rem;">
        <span class="brand-leaf" style="width: 36px; height: 36px; font-size: 1.25rem;">🌿</span>
      </div>
      <h1 class="auth-title">Daftar NutriTrack</h1>
      <p class="auth-subtitle">Mulai kelola asupan nutrisi Anda dengan rapi dan terukur.</p>
    </div>

    <div id="alertBox" class="alert" style="display: none;"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="name">Nama Lengkap</label>
        <input type="text" id="name" class="form-input" placeholder="Nama Anda" required autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Alamat Email</label>
        <input type="email" id="email" class="form-input" placeholder="nama@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Kata Sandi (Minimal 6 karakter)</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-primary btn-block" style="margin-top: 1.25rem;">
        Daftar Akun
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Sudah memiliki akun? <a href="/login" style="color: var(--accent-primary); font-weight: 500; text-decoration: none;">Masuk di sini</a>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (password.length < 6) {
        alertBox.className = 'alert alert-danger';
        alertBox.innerText = 'Kata sandi minimal 6 karakter.';
        alertBox.style.display = 'block';
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Mendaftarkan...';

      try {
        await API.post('/api/auth/register', { name, email, password });
        window.location.href = '/';
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.innerText = err.message || 'Gagal mendaftar. Silakan coba kembali.';
        alertBox.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Daftar Akun';
      }
    });
  </script>
</body>
</html>
